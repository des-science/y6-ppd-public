# This file shows an example of how you can easily set up runs in
# a cosmosis campaign file for importances sampling runs saving
# model predictions for observables as derived parameters. This
# is a necessary input to the PPD calculations.

#========================================================
#  Need to define chain directory paths as bash variables in  your job script.
#    ${OUTPUT_DIR} : where output from this run goes
#    ${ORIG_CHAIN_DIR} : where importance sampler input chain is

output_dir: ${OUTPUT_DIR}
include: campaign_file_for_original_chains.yml
# ^ the above yml should be where runs are defined for the original chains

components:
  # campaign component that removes scale cuts
  nocuts:
    params:
    - 2pt_like.angle_range_wtheta_1_2 = 0.0000 999.0000
    - 2pt_like.angle_range_wtheta_1_3 = 0.0000 999.0000
    - 2pt_like.angle_range_wtheta_1_4 = 0.0000 999.0000
