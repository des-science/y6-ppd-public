runs:

  # Saving 3x2pt DV elements for 3x2pt chain 
  # Use samples & pipeline from 
  #    campaign file: campaign_file_for_original_chains.yml
  #    run: 32pt_lcdm_baseline
  # BUT USING NO SCALE CUTS
  - name: ppd.32pt_lcdm_baseline-IS
    parent:  32pt_lcdm_baseline
    components:
    - nocuts
    params:
    # the trickiest piece here is making sure we count the number of DV elements
    # correctly for this extra_output. You could have the IS pipeline
    # use the same scale cuts as the original chain, but that'll make
    # the data vector (DV) element counting more complicated, so I just run this with no cuts.
    # In earlier tests I was doing 1000 was the right number
    # for max angle of 250”, but we need a higher number for the DV with more elements
    - pipeline.extra_output = data_vector/2pt_theory#1300
    - pipeline.fast_slow=F
    - sampler = importance
    # This next line should point to the original chain we want the posterior from.
    # I recommend using the ORIG_CHAIN_DIR bash variable rather than hard-coding
    # your path so that this same yml file could be used by multiple users
    # who might be running on different systems.
    - importance.input = ${ORIG_CHAIN_DIR}/32pt_lcdm_baseline.txt

  # Saving 3x2pt DV elements for 2x2pt chain
  #   Note that 3x2pt uses the same parameters as 2x2pt, so we
  #   can compute the full 3x2pt DV for each sample. Doing this
  #   will let us do PPD test for P(shear|2x2pt)
  # Use samples from the chain output from 
  #    campaign file: campaign_file_for_original_chains.yml
  #    run name: 22pt_lcdm_baseline
  # Saving DV for pipeline matching that in 
  #    campaign file:  campaign_y6fast_32pt.yml
  #    run name: 32pt_lcdm_baseline 
  # BUT USING NO SCALE CUTS
  - name: ppd.22pt_lcdm_baseline-IS
    parent:  32pt_lcdm_baseline
    components:
    - nocuts
    params:
    - pipeline.extra_output = data_vector/2pt_theory#1300
    - pipeline.fast_slow=F
    - sampler = importance
    - importance.input = ${ORIG_CHAIN_DIR}/22pt_lcdm_baseline.txt

  # Saving 1x2pt (Shear only) DV elements for 1x2pt chain
  # Use samples & pipeline from 
  #    campaign file: campaign_file_for_original_chains.yml
  #    run: 12pt_lcdm_baseline
  # BUT USING NO SCALE CUTS
  - name: ppdw.12pt_lcdm_baseline-IS
    parent: 12pt_lcdm_baseline
    components:
    - nocuts
    params:
    # again, the number of points that need to be saved will depend on 
    # the number of angular bins being computed in the 2pt_like module
    # shear-only pipeline has fewer 2pt observables than 3x2pt, adjust count!
    - pipeline.extra_output = data_vector/2pt_theory#520
    - pipeline.fast_slow=F
    - sampler = importance
    - importance.input = ${ORIG_CHAIN_DIR}/12pt_lcdm_baseline.txt

